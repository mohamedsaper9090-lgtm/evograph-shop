  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

>\n      <a onclick=\"{{ goContactMobile }}\" style=\"margin-top:12px;height:48px;border-radius:13px;display:grid;place-items:center;font-weight:600;color:#0a0710;background:linear-gradient(135deg,var(--v2-purple),var(--v2-pink));cursor:pointer;\">{{ t.cta_start }}<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  /* ===========================================================================\n     WORDPRESS / WOOCOMMERCE CONVERSION NOTES (front-end prototype only)\n     ---------------------------------------------------------------------------\n     1. LUCKY WHEEL daily limit: store last-spin per WordPress user (user meta,\n        e.g. 'evo_last_spin' = unix time) and enforce the 24h window SERVER-SIDE.\n        The localStorage 'spins' map here is demo-only and bypassable.\n     2. AUTH / SOCIAL LOGIN: email/password -> WP accounts. Google & Discord ->\n        a social-login plugin (Nextend Social Login) or custom OAuth2 apps.\n        Never handle OAuth tokens in client JS.\n     3. CHECKOUT: no real payment code here. Use WooCommerce gateways —\n        PayPal (primary) via official \"PayPal Payments\" plugin; cards via PayPal\n        Advanced Card Processing if the merchant supports it; Apple Pay via\n        Stripe / WooPayments (recommended over PayPal for Apple Pay).\n     4. PORTFOLIO: model items as a \"Project\" CPT or Gutenberg dynamic block with\n        media upload + media_type + youtube_url + category taxonomy + featured flag.\n     5. i18n: EN/AR strings live in dict(); in WP use Polylang/WPML string translation.\n     =========================================================================== */\n  state = { page:'home', lang:'en', theme:'dark', currency:'USD', cart:[], auth:false, user:null,\n    searchOpen:false, query:'', cartOpen:false, menuOpen:false, toast:null, faq:0,\n    spinResult:null, spinning:false, rotation:0, winOpen:false, spins:{}, nextSpinTxt:'', copied:false, catFilter:'all', pvId:'p1',\n    authMode:'login', acctTab:'orders', coupon:'', appliedCoupon:'', couponMsg:null, checkoutDone:false, formErr:'', lastOrder:'', payMethod:'paypal', portFilter:'all', lightbox:null, myOrders:[], winData:null, wonCoupons:{} };\n\n  // Unique demo coupon code generator. WORDPRESS: do NOT generate codes client-side — create a unique,\n  // one-time-use WooCommerce coupon SERVER-SIDE per win, tied to the winning user/email, with an expiry date.\n  genCode(){ const c='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<6;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }\n  // resolve a coupon code -> discount %. Checks per-user won coupons first, then base demo coupons.\n  discountFor(code){ const c=(code||'').trim().toUpperCase(); if(this.state.wonCoupons && this.state.wonCoupons[c]!=null) return this.state.wonCoupons[c]; const base=this.COUPONS(); return base[c]!=null?base[c]:null; }\n\n  // Front-end demo coupons. WORDPRESS: replace with WooCommerce coupons (admin-managed); Lucky Wheel codes should be created as WC coupons too.\n  COUPONS(){ return { EVO5:5, EVO10:10, EVO15:15, EVO20:20, EVO25:25, EVO30:30, EVO40:40, EVO50:50, EVO60:60, WELCOME10:10, FREEREV:0, BONUS250:0, DISCORDPK:0, MYSTERY:0 }; }\n\n  componentDidMount(){\n    try{\n      const s=JSON.parse(localStorage.getItem('evo')||'{}');\n      // WORDPRESS NOTE: spins is a per-email map { 'user@mail.com': lastSpinTimestamp }. In WP this MUST live server-side keyed by WordPress user ID (e.g. user meta 'evo_last_spin'), not localStorage, so the daily limit can't be bypassed by clearing the browser.\n      this.setState({ lang:s.lang||'en', theme:s.theme||'dark', currency:s.currency||'USD', cart:s.cart||[], auth:!!s.auth, user:s.user||null, spins:s.spins||{}, myOrders:s.myOrders||[], wonCoupons:s.wonCoupons||{} }, ()=>{ this.applyLang(this.state.lang); this.applyTheme(this.state.theme); });\n    }catch(e){}\n    requestAnimationFrame(()=>{ this.applyLang(this.state.lang); this.applyTheme(this.state.theme); this.applyResponsive(); this.initFx(); });\n    this._r=()=>this.applyResponsive(); window.addEventListener('resize',this._r);\n    // live countdown tick for the Lucky Wheel lock (only repaints while viewing Events + locked)\n    this._tick=setInterval(()=>{ if(this.state.page==='events' && this.state.auth && this.isLocked()) this.forceUpdate(); }, 1000);\n    // hash deep-links: #products etc route to that page; any unknown hash -> 404 (go() validates)\n    this._hash=()=>{ const h=(location.hash||'').replace(/^#\\/?/,'').trim(); if(h) this.go(h); };\n    window.addEventListener('hashchange', this._hash);\n    if((location.hash||'').replace(/^#\\/?/,'').trim()) requestAnimationFrame(this._hash);\n  }\n  componentWillUnmount(){ window.removeEventListener('resize',this._r); if(this._spinTimer) clearTimeout(this._spinTimer); if(this._tick) clearInterval(this._tick); if(this._hash) window.removeEventListener('hashchange',this._hash); if(this._fxMove) window.removeEventListener('mousemove',this._fxMove); if(this._fxScroll) window.removeEventListener('scroll',this._fxScroll); }\n\n  // ---------- ANIMATION / FX ENGINE (lightweight vanilla) ----------\n  initFx(){\n    if(this._fxReady) return; this._fxReady=true;\n    var SAFE=(fn)=>function(){ try{ return fn.apply(this,arguments); }catch(e){} };\n    const reduce = (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) || ('ontouchstart' in window);\n    // header sticky transition\n    this._fxScroll=SAFE(()=>{ const h=document.querySelector('[data-evo-pill]'); if(!h) return; const y=window.scrollY; const on=y>14; h.style.boxShadow=on?'0 18px 50px rgba(0,0,0,.55)':'0 14px 40px rgba(0,0,0,.45)'; h.style.transform=on?'scale(.985)':'scale(1)'; h.style.borderColor=on?'color-mix(in srgb,var(--v2-purple) 28%,var(--v2-line))':'var(--v2-line)'; });\n    window.addEventListener('scroll',this._fxScroll,{passive:true});\n    // pointer parallax (rAF-throttled) for hero + ambient blobs/grid — DESKTOP ONLY (skipped on touch/reduced-motion)\n    if(!reduce){\n      let tx=0,ty=0,raf=0;\n      this._fxMove=SAFE((ev)=>{ const w=window.innerWidth,hgt=window.innerHeight; tx=(ev.clientX/w-0.5); ty=(ev.clientY/hgt-0.5);\n        if(raf) return; raf=requestAnimationFrame(()=>{ raf=0; try{\n          document.querySelectorAll('[data-evo-blob]').forEach((b,i)=>{ const d=(i+1)*16; b.style.transform=`translate(${ -tx*d }px,${ -ty*d }px)`; });\n          const g=document.querySelector('[data-evo-grid]'); if(g) g.style.transform=`translate(${ tx*10 }px,${ ty*10 }px)`;\n          const media=document.querySelector('[data-evo-heromedia]'); if(media) media.style.transform=`translate(${ tx*16 }px,${ ty*16 }px)`;\n          if(this._mag){ const r=this._mag.getBoundingClientRect(); const mx=ev.clientX-(r.left+r.width/2), my=ev.clientY-(r.top+r.height/2); this._mag.style.transform=`translate(${mx*0.28}px,${my*0.34}px)`; }\n        }catch(e){} });\n      });\n      window.addEventListener('mousemove',this._fxMove,{passive:true});\n      // magnetic hover (desktop pointers only)\n      document.addEventListener('mouseover',SAFE((e)=>{ const b=e.target&&e.target.closest&&e.target.closest('[data-evo-mag]'); if(b) this._mag=b; }));\n      document.addEventListener('mouseout',SAFE((e)=>{ const b=e.target&&e.target.closest&&e.target.closest('[data-evo-mag]'); if(b && b===this._mag){ this._mag=null; b.style.transform=''; } }));\n    }\n    // click ripple on gradient/CTA buttons (works for tap + click)\n    document.addEventListener('pointerdown',SAFE((e)=>{ const b=e.target&&e.target.closest&&e.target.closest('[data-evo-mag]'); if(!b) return; const r=b.getBoundingClientRect(); const rip=document.createElement('span'); const sz=Math.max(r.width,r.height); rip.style.cssText=`position:absolute;left:${e.clientX-r.left-sz/2}px;top:${e.clientY-r.top-sz/2}px;width:${sz}px;height:${sz}px;border-radius:50%;background:rgba(255,255,255,.35);pointer-events:none;transform:scale(0);opacity:.7;animation:evoRipple .55s ease-out forwards;`; const cs=getComputedStyle(b); if(cs.position==='static') b.style.position='relative'; if(cs.overflow!=='hidden') b.style.overflow='hidden'; b.appendChild(rip); setTimeout(()=>rip.remove(),560); }));\n    this.scanFx();\n  }\n  // tag new elements after each navigation/render (parallax handle, magnetic buttons, orbit trails)\n  scanFx(){\n    try{\n    // hero media handle for parallax\n    const hero=document.querySelector('[data-evo-hero]'); if(hero){ const m=hero.children[1]; if(m) m.setAttribute('data-evo-heromedia',''); }\n    // mark gradient + key CTAs as magnetic\n    document.querySelectorAll('button,a').forEach(el=>{ if(el.__mag) return; const st=(el.getAttribute('style')||''); if(st.indexOf('linear-gradient(135deg,var(--v2-purple)')>-1 || el.hasAttribute('data-evo-cta')){ el.__mag=1; el.setAttribute('data-evo-mag',''); el.style.transition=(el.style.transition?el.style.transition+',':'')+'transform .25s cubic-bezier(.2,.8,.2,1)'; } });\n    // orbit dots glow trail\n    document.querySelectorAll('[data-evo-hero] span[style*=\"box-shadow: 0 0 16px\"],[data-evo-hero] span[style*=\"box-shadow: 0 0 14px\"],[data-evo-hero] span[style*=\"box-shadow: 0 0 12px\"]').forEach(s=>{ if(s.__tr) return; s.__tr=1; s.style.animation=(s.style.animation?s.style.animation+',':'')+'evoTrail 3.2s ease-in-out infinite'; });\n    }catch(e){}\n  }\n\n  save(){ const {lang,theme,currency,cart,auth,user,spins,myOrders,wonCoupons}=this.state; try{ localStorage.setItem('evo',JSON.stringify({lang,theme,currency,cart,auth,user,spins,myOrders,wonCoupons})); }catch(e){} }\n  // Lucky Wheel: daily limit, keyed per logged-in email. Switching account = its own daily allowance.\n  spinKey(){ return (this.state.user&&this.state.user.email)?this.state.user.email.toLowerCase():null; }\n  lastSpinTs(){ const k=this.spinKey(); return (k&&this.state.spins[k])?this.state.spins[k]:0; }\n\n  applyResponsive(){\n    const w=window.innerWidth; const set=(s,c)=>{const e=document.querySelector(s); if(e) e.style.gridTemplateColumns=c;};\n    const nav=document.querySelector('[data-evo-nav]'); const burger=document.querySelector('[data-evo-burger]');\n    if(nav) nav.style.display=w<1180?'none':'flex'; if(burger) burger.style.display=w<1180?'flex':'none';\n    const cta=document.querySelector('[data-evo-ctabtn]'); if(cta) cta.style.display=w<700?'none':'inline-flex';\n    const ab=document.querySelector('[data-evo-authbtn]'); if(ab) ab.style.display=w<560?'none':'inline-flex';\n    const cu=document.querySelector('[data-evo-curr]'); if(cu) cu.style.display=w<480?'none':'block';\n    const hero=document.querySelector('[data-evo-hero]'); if(hero) hero.style.gridTemplateColumns=w<920?'1fr':'1.05fr .95fr';\n    set('[data-evo-grid4]', w<560?'1fr':w<1024?'repeat(2,1fr)':'repeat(4,1fr)');\n    set('[data-evo-grid4b]', w<560?'1fr':w<1024?'repeat(2,1fr)':'repeat(4,1fr)');\n    set('[data-evo-catgrid]', w<760?'1fr':'repeat(6,1fr)');\n    set('[data-evo-portgrid]', w<700?'repeat(2,1fr)':'repeat(4,1fr)');\n    set('[data-evo-stepgrid]', w<640?'repeat(2,1fr)':w<960?'repeat(3,1fr)':'repeat(5,1fr)');\n    set('[data-evo-toolgrid]', w<640?'1fr':w<960?'repeat(2,1fr)':'repeat(3,1fr)');\n    set('[data-evo-reviewwrap]', w<860?'1fr':'1.15fr .85fr');\n    set('[data-evo-contact]', w<800?'1fr':'1fr 1fr');\n    set('[data-evo-footgrid]', w<760?'1fr 1fr':'1.7fr repeat(4,1fr)');\n    set('[data-evo-prodgrid]', w<560?'1fr':w<900?'repeat(2,1fr)':w<1200?'repeat(3,1fr)':'repeat(4,1fr)');\n    set('[data-evo-detail]', w<840?'1fr':'1fr 1fr');\n    set('[data-evo-acct]', w<820?'1fr':'260px 1fr');\n    set('[data-evo-wheelwrap]', w<880?'1fr':'1fr 1fr');\n    set('[data-evo-about2]', w<820?'1fr':'1fr 1fr');\n    set('[data-evo-about3]', w<760?'1fr':'repeat(3,1fr)');\n    set('[data-evo-pfgrid]', w<560?'1fr':w<900?'repeat(2,1fr)':'repeat(3,1fr)');\n    set('[data-evo-pffea
